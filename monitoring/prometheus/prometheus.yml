global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: flashsale-backend
    metrics_path: /metrics
    static_configs:
      - targets: ['backend:8080']

  - job_name: redis-exporter
    static_configs:
      - targets: ['redis-exporter:9121']
